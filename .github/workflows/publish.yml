# Publishes the crate to crates.io. Triggered manually from the Actions tab
# (workflow_dispatch) - this crate is not released via GitHub tags.

name: publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Gate the release on the same checks run locally.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Publish
        run: cargo publish --token "${{ secrets.CRATES_IO_TOKEN }}"
