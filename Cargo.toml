[package]
name = "steam-depot-downloader-mod"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Rust library for downloading Steam depot content with user-supplied depot keys and manifest files - embeddable in GUIs, CLIs and services alike."
license = "GPL-2.0-only"
repository = "https://github.com/enXov/steam-depot-downloader-mod"
readme = "README.md"
keywords = ["steam", "depot", "downloader", "cdn", "valve"]
categories = ["network-programming", "filesystem"]
# Test fixtures (real manifests + depot keys) are for development only - they stay in the
# repository but are not redistributed through crates.io.
exclude = ["tests/fixtures"]

[dependencies]
steam-protobuf-rs = { version = "0.1" }
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "time", "macros"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = "0.1"
sha1 = "0.10"
adler2 = "2"
base64 = "0.22"
zstd = "0.13"
lzma-rs = { version = "0.3", features = ["raw_decoder"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
tempfile = "3"
crc32fast = "1"
wiremock = "0.6"

# ── Rust Lints ────────────────────────────────────────────────────────────────

[lints.rust]
unsafe_code = "deny"
unused_imports = "warn"

[lints.clippy]
dbg_macro = "deny"              # leftover dbg!() must never ship
todo = "deny"                   # leftover TODOs must never ship
unwrap_used = "warn"            # Result::unwrap() can panic - use expect() or ?
needless_pass_by_value = "warn" # perf hint: avoid cloning args unnecessarily
clone_on_ref_ptr = "warn"       # accidental expensive clone of Arc/Rc
explicit_counter_loop = "warn"  # prefer .iter().enumerate()
manual_strip = "warn"           # use str::strip_prefix / strip_suffix
string_lit_as_bytes = "warn"    # use b"..." instead of "...".as_bytes()
single_match_else = "warn"
